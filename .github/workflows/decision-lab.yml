name: Decision Lab checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    defaults:
      run:
        working-directory: mcdm_streamlit_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcdm_streamlit_app/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app.py decisionlab tests
      - run: python -m ruff format --check app.py decisionlab tests
      - run: python -m pytest -q
